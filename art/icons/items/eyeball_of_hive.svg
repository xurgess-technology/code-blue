<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="ball"><circle cx="112" cy="124" r="56"/></clipPath>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="36" fill="#0b1416"/>
  <rect x="9" y="9" width="238" height="238" rx="33" fill="none" stroke="#2a3438" stroke-width="4"/>

  <g transform="translate(14 0)">
  <!-- the optic nerve, trailing off the back -->
  <path d="M166 132 Q190 130 196 150 Q200 168 214 172" fill="none" stroke="#1c2226" stroke-width="24" stroke-linecap="round"/>
  <path d="M166 132 Q190 130 196 150 Q200 168 214 172" fill="none" stroke="#d98a8a" stroke-width="13" stroke-linecap="round"/>

  <g filter="url(#glow)">
    <!-- the eyeball, seen from the side: the front of the eye faces left -->
    <circle cx="112" cy="124" r="58" fill="#ff8a2a"/>
    <!-- veins running back toward the nerve -->
    <g clip-path="url(#ball)" fill="none" stroke="#c0341c" stroke-linecap="round" stroke-width="5">
      <path d="M170 104 Q146 100 128 90"/>
      <path d="M142 99 Q140 88 132 80"/>
      <path d="M170 146 Q148 154 130 158"/>
      <path d="M150 124 Q132 124 118 118"/>
      <path d="M148 151 Q146 164 138 172"/>
    </g>
    <circle cx="112" cy="124" r="58" fill="none" stroke="#4a1a06" stroke-width="9"/>
    <!-- the cornea bulge and iris, edge on -->
    <path d="M56 94 Q36 124 56 154" fill="#ffc45e" stroke="#4a1a06" stroke-width="7" stroke-linejoin="round"/>
    <ellipse cx="52" cy="124" rx="5" ry="15" fill="#2a0e03"/>
    <ellipse cx="46" cy="106" rx="3" ry="5" fill="#fff6e6"/>
    <ellipse cx="96" cy="96" rx="12" ry="7" fill="#ffd9a8" opacity="0.8" transform="rotate(-25 96 96)"/>
  </g>
  </g>
</svg>
